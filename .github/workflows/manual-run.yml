name: Manual Outreach Workflow

on:
  # This enables the manual "Run workflow" button in the GitHub Actions tab
  workflow_dispatch: 

  # Optional: Uncomment the lines below to also run automatically every day
  # schedule:
  #   - cron: '0 5 * * *' # Runs daily at 5:00 AM UTC

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger App Workflow API
        # We use curl to securely hit your live application API endpoint.
        # Ensure you add 'APP_URL' in your GitHub Repository Secrets.
        run: |
          echo "Triggering workflow at ${{ secrets.APP_URL }}..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.APP_URL }}/api/workflow" \
            -H "Content-Type: application/json")
          
          echo "$response"
          
          # Check if the execution was successful
          HTTP_STATUS=$(echo "$response" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Workflow failed with status $HTTP_STATUS"
            exit 1
          fi
